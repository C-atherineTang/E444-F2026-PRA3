{% extends "bootstrap/base.html" %}

{% block title %}Flasky Chatbot{% endblock %}

{% block content %}
<div class="container">

    <div class="page-header">
        <h1>Chatbot</h1>
        <p>Welcome, {{ name }}!</p>
    </div>

    <div id="chat-area" class="well">
        <p><strong>Bot:</strong> Hello! Tell me something about yourself.</p>
    </div>

    <div class="form-group">
        <input
            type="text"
            id="message"
            class="form-control"
            placeholder="Type your message..."
        >
    </div>

    <button onclick="sendMessage()" class="btn btn-primary">
        Send
    </button>

    <a href="{{ url_for('logout') }}" class="btn btn-danger">
        Logout
    </a>

</div>
{% endblock %}

{% block scripts %}
{{ super() }}

<script>
function sendMessage() {
    const messageInput = document.getElementById('message');
    const message = messageInput.value;

    if (message.trim() === '') {
        return;
    }

    const chatArea = document.getElementById('chat-area');

    chatArea.innerHTML +=
        '<p><strong>You:</strong> ' + message + '</p>';

    fetch('/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: message
        })
    })
    .then(response => response.json())
    .then(data => {
        chatArea.innerHTML +=
            '<p><strong>Bot:</strong> ' + data.reply + '</p>';

        messageInput.value = '';
        messageInput.focus();
    });
}
</script>
{% endblock %}
